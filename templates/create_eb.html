<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetica | Create E-book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-gray-200 flex items-center justify-center">

  <div class="glass rounded-2xl p-10 shadow-lg w-full max-w-md mx-4">
    <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 text-center mb-6">
      Add New Job
    </h1>

    <form action="/create-ebook" method="post" class="space-y-5">
      <div>
        <label for="bname1" class="block mb-1 text-gray-300">Role Name</label>
        <input type="text" id="bname1" name="name" 
               class="w-full px-4 py-2 rounded-lg bg-gray-900/70 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
      </div>

      <div>
        <label for="aname1" class="block mb-1 text-gray-300">Company Name</label>
        <input type="text" id="aname1" name="author" 
               class="w-full px-4 py-2 rounded-lg bg-gray-900/70 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
      </div>

      <div>
        <label for="uname1" class="block mb-1 text-gray-300">Skills</label>
        <input type="text" id="uname1" name="url" placeholder="C++/ Python etc.."
               class="w-full px-4 py-2 rounded-lg bg-gray-900/70 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
      </div>

      <div class="text-center">
        <button type="submit" 
                class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold hover:opacity-90 transition">
          Add Job
        </button>
      </div>
    </form>
  </div>

</body>
</html>
