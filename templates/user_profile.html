<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center">
    
  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6">Edit Profile</h1>
    <form method="POST">
      <label class="block mb-2">Username</label>
      <input type="text" name="username" value="{{ user.username }}" class="w-full mb-4 p-2 rounded bg-gray-700 text-white">

      <label class="block mb-2">Email</label>
      <input type="email" name="email" value="{{ user.email }}" class="w-full mb-4 p-2 rounded bg-gray-700 text-white">

      <label class="block mb-2">Skills (comma separated)</label>
      <input type="text" name="skills" value="{{ user.skills }}" class="w-full mb-4 p-2 rounded bg-gray-700 text-white">

      <label class="block mb-2">Password (leave blank to keep current)</label>
      <input type="password" name="password" class="w-full mb-6 p-2 rounded bg-gray-700 text-white">

      <button type="submit" class="w-full bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded">Update Profile</button>
    </form>
  </div>
</body>
</html>
