<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); }
    .scroll-area { max-height: 300px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #a855f7 #1a1a1a; }
    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-gray-200">

  <!-- Navbar -->
  <nav class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
    <a href="#" class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
      Welcome {{this_company.username}}
    </a>
    <div class="flex items-center gap-6">
      <a href="/company_dash/{{this_company.id}}" class="text-gray-300 hover:text-purple-400 transition">Home</a>
      <a href="/post_job/{{this_company.id}}" class="text-gray-300 hover:text-pink-400 transition">Post Job</a>
      <a href="/login" class="text-gray-300 hover:text-pink-400 transition">Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-10 space-y-12">

    <!-- Students Applied -->
    <section class="glass rounded-2xl p-6 shadow-md">
      <h3 class="text-xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 mb-4">
        Students Applied
      </h3>
      <div class="scroll-area">
        <table class="w-full text-left text-gray-300">
          <thead class="bg-gray-900/60 text-gray-400">
            <tr>
              <th class="px-4 py-2">Student ID</th>
              <th class="px-4 py-2">Username</th>
              <th class="px-4 py-2">Applied Job</th>
              <th class="px-4 py-2">Skills</th>
              <th class="px-4 py-2 text-center">Action</th>
            </tr>
          </thead>
          <tbody>
            {% for app in applications %}
<tr>
    <td>{{ app.id }}</td>
    <td>{{ app.username }}</td>
    <td>{{ app.job_title }}</td>
    <td>{{ app.skills }}</td>
    <td>
        <a href="/view_student/{{app.id}}">View</a>
    </td>
</tr>
{% else %}
<tr>
    <td colspan="5">No students applied for granted jobs yet.</td>
</tr>
{% endfor %}
          </tbody>
        </table>
      </div>
    </section>

  </main>

</body>
</html>
