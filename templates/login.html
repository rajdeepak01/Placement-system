<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetica | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-gray-950 to-black text-gray-200">

  <!-- Login Card -->
  <div class="glass p-8 rounded-2xl shadow-lg w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
        <a href="/">Welcome Back</a>
      </h1>
      <p class="text-gray-400 mt-2">One step away from your journey 🚀</p>
    </div>

    <!-- Flash Message -->
    <p id="flash-message" class="text-pink-400 text-center mb-4">{{msg}}</p>

    <!-- Login Form -->
    <form action="/login" method="post" class="space-y-5">
      <div>
        <label for="username1" class="block text-sm font-medium mb-1">Username</label>
        <input type="text" id="username1" name="username" placeholder="yourname01"
          class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500">
      </div>
      <div>
        <label for="pass" class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="pass" name="pwd" placeholder="**********"
          class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500">
      </div>
      <button type="submit"
        class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 font-semibold text-white hover:opacity-90 transition">
        Login
      </button>
    </form>

    <!-- Footer -->
    <div class="text-center mt-6 text-gray-400">
      New here? 
      <a href="/register" class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 font-semibold hover:underline">
        Register
      </a>
    </div>
  </div>

  <!-- Flash Message Auto-hide -->
  <script>
    setTimeout(function() {
      let msg = document.getElementById("flash-message");
      if(msg) { msg.style.display = "none"; }
    }, 2000);
  </script>
</body>
</html>
