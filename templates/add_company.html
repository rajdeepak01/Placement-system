<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetica | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-gray-200 flex flex-col">

  <!-- Navbar -->
  <nav class="glass sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between shadow-lg gap-4 sm:gap-0">
    <a href="#" 
       class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
      Welcome {{this_user.username}}
    </a>

    <div class="flex items-center gap-6">
                  <a href="/admin" class="text-gray-300 hover:text-pink-400 transition">Home</a>
                  <a href="/hiring_req" class="text-gray-300 hover:text-pink-400 transition">Hiring Request</a>

      <a href="/add_company" class="text-gray-300 hover:text-pink-400 transition">Add Company</a>
      <a href="/partners" class="text-gray-300 hover:text-pink-400 transition">Hiring Patners</a>

      <a href="/summary" class="text-gray-300 hover:text-purple-400 transition">Summary</a>
      <a href="/login" class="text-gray-300 hover:text-pink-400 transition">Logout</a>
      <!-- Search -->
      <form action="/search" method="get" class="flex gap-2 mt-2 sm:mt-0">
        <input type="text" name="search" placeholder="Search..."
               class="px-3 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <select name="key" class="px-2 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700">
          <option selected>Select</option>
          <option value="user">User</option>
          <option value="ebook">Jobs</option>
        </select>
        <button type="submit" 
                class="px-4 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90 transition">
          Search
        </button>
      </form>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-gray-800/70 glass p-8 rounded-2xl shadow-lg">
      <h1 class="text-2xl font-bold mb-6 text-center text-white">Add Company</h1>

      <form action="/add_company" method="post" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium mb-1">Company Name</label>
          <input type="text" id="username" name="username" placeholder="yourname01"
                 class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>

        <div>
          <label for="email" class="block text-sm font-medium mb-1">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com"
                 class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-1">Password</label>
          <input type="password" id="password" name="pwd" placeholder="**********"
                 class="w-full px-4 py-3 rounded-xl bg-gray-900 border border-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        
        <button type="submit"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 font-semibold text-white hover:opacity-90 transition">
          Register
        </button>
      </form>
    </div>
  </main>

</body>
</html>
