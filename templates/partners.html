<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetica | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
    .scroll-area {
      max-height: 250px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #a855f7 #1a1a1a;
    }
    .scroll-area::-webkit-scrollbar { width: 6px; }
    .scroll-area::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-gray-200">

  <!-- Navbar -->
  <nav class="glass sticky top-0 z-50 px-6 py-4 flex items-center justify-between shadow-lg">
    <a href="#" 
       class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
      Welcome {{this_user.username}}
    </a>

    <div class="flex items-center gap-6">
                  <a href="/admin" class="text-gray-300 hover:text-pink-400 transition">Home</a>

      <a href="/add_company" class="text-gray-300 hover:text-pink-400 transition">Add Company</a>
      <a href="/partners" class="text-gray-300 hover:text-pink-400 transition">Hiring Patners</a>

      <a href="/summary" class="text-gray-300 hover:text-purple-400 transition">Summary</a>
      <a href="/login" class="text-gray-300 hover:text-pink-400 transition">Logout</a>  <!-- Search -->
      <form action="/search" method="get" class="flex gap-2">
        <input type="text" name="search" placeholder="Search..."
               class="px-3 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500">
        <select name="key" class="px-2 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700">
          <option selected>Select</option>
          <option value="user">User</option>
          <option value="ebook">Jobs</option>
        </select>
        <button type="submit" 
                class="px-4 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90 transition">
          Search
        </button>
      </form>
    </div>
  </nav>

  <!-- Content -->
 <main class="max-w-6xl mx-auto px-6 py-10 space-y-8">

    <h1 class="text-2xl font-bold mb-4 text-white">All Partner Companies</h1>

    <div class="scroll-area glass rounded-2xl p-4 shadow-md">
      <table class="w-full text-left text-gray-300">
        <thead class="bg-gray-900/60 text-gray-400">
          <tr>
            <th class="px-4 py-2">ID</th>
            <th class="px-4 py-2">Company Name</th>
            <th class="px-4 py-2">Email</th>
          </tr>
        </thead>
        <tbody>
          {% for company in companies %}
          <tr class="border-b border-gray-700/50 hover:bg-gray-800/40 transition">
            <td class="px-4 py-2">{{ company.id }}</td>
            <td class="px-4 py-2">{{ company.username }}</td>
            <td class="px-4 py-2">{{ company.email }}</td>
          </tr>
          {% else %}
          <tr>
            <td colspan="3" class="px-4 py-2 text-center text-gray-400">No companies found.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </main>

</body>
</html>
