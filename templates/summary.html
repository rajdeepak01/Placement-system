<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetica | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }
    .chart-container {
      max-width: 100%;
      overflow-x: auto;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-gray-950 to-black text-gray-200">

  <!-- Navbar -->
  <nav class="glass sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between shadow-lg">
    <a href="#" 
       class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
      Welcome {{this_user.username}}
    </a>

    <div class="flex items-center gap-6">
                  <a href="/admin" class="text-gray-300 hover:text-pink-400 transition">Home</a>

      <a href="/add_company" class="text-gray-300 hover:text-pink-400 transition">Add Company</a>
      <a href="/partners" class="text-gray-300 hover:text-pink-400 transition">Hiring Patners</a>

      <a href="/summary" class="text-gray-300 hover:text-purple-400 transition">Summary</a>
      <a href="/login" class="text-gray-300 hover:text-pink-400 transition">Logout</a>
      <form action="/search" method="get" class="flex gap-2 flex-wrap">
        <input type="text" name="search" placeholder="Search..."
               class="px-3 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500"/>
        <select name="key" class="px-2 py-2 rounded-lg bg-gray-900/70 text-gray-200 border border-gray-700">
          <option selected>Select</option>
          <option value="user">User</option>
          <option value="job">Jobs</option>
        </select>
        <button type="submit" 
                class="px-4 py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90 transition">
          Search
        </button>
      </form>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-7xl mx-auto px-6 py-10 space-y-12">

    <!-- Job Status Charts -->
    <section class="grid md:grid-cols-2 gap-6">
      <div class="glass rounded-2xl p-6 shadow-md flex flex-col items-center justify-center">
        <h3 class="text-xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-4">
          Job Distribution (Pie Chart)
        </h3>
        <div class="chart-container">
          <img src="/static/pie.png" alt="PieChart" class="max-w-full h-auto rounded-xl shadow-lg">
        </div>
      </div>

      <div class="glass rounded-2xl p-6 shadow-md flex flex-col items-center justify-center">
        <h3 class="text-xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500 mb-4">
          Job Status Over Time (Bar Chart)
        </h3>
        <div class="chart-container">
          <img src="/static/bar.png" alt="BarChart" class="max-w-full h-auto rounded-xl shadow-lg">
        </div>
      </div>
    </section>

    <!-- Optional: Stats Cards -->
    

  </main>

</body>
</html>
